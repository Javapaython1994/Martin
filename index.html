<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصميم رقم 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; background: #000; color: #fff; } </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="relative inline-block max-w-full select-none">
        <img id="exportImg" src="https://raw.githubusercontent.com/Javapaython1994/History/main/img_Arabic_Designer_1781336094500.png" class="max-w-full max-h-[85vh] object-contain rounded-xl border border-zinc-800 block" alt="تصميم رقم 3" />
        <svg id="exportSvg" class="absolute inset-0 w-full h-full pointer-events-none rounded-xl" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <defs>
                <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            <g id="exportPathGroup"></g>
            <g id="exportLabelsGroup"></g>
            <g id="exportPointsGroup"></g>
        </svg>
        <button onclick="playAnim()" class="absolute top-2 right-2 bg-indigo-600/90 hover:bg-indigo-500 text-white font-semibold text-sm px-4 py-2 rounded-xl shadow-xl flex items-center gap-2 cursor-pointer backdrop-blur-md border border-indigo-400/40">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
            <span>استطلاع</span>
        </button>
    </div>

    <script>
        const linePoints = [
  {
    "x": 468,
    "y": 431,
    "text": ""
  },
  {
    "x": 466,
    "y": 71,
    "text": ""
  },
  {
    "x": 743,
    "y": 418,
    "text": ""
  },
  {
    "x": 830,
    "y": 876,
    "text": ""
  },
  {
    "x": 316,
    "y": 764,
    "text": ""
  },
  {
    "x": 78,
    "y": 542,
    "text": ""
  },
  {
    "x": 189,
    "y": 304,
    "text": ""
  }
];
        const finalTextStr = "شمال شرق";
        let animProgress = 0, animId = null, finalTextTimeout = null, showFinalText = false;

        function playAnim() {
            if (animId) cancelAnimationFrame(animId);
            if (finalTextTimeout) clearTimeout(finalTextTimeout);
            showFinalText = false; animProgress = 0;
            const startTime = performance.now();
            const duration = Math.max(1500, linePoints.length * 900);
            function step(timestamp) {
                animProgress = Math.min(1, (timestamp - startTime) / duration);
                render();
                if (animProgress < 1) animId = requestAnimationFrame(step);
                else {
                    finalTextTimeout = setTimeout(() => { showFinalText = true; render(); }, 1000);
                }
            }
            animId = requestAnimationFrame(step);
        }

        function render() {
            const pGroup = document.getElementById('exportPathGroup');
            const lGroup = document.getElementById('exportLabelsGroup');
            const ptGroup = document.getElementById('exportPointsGroup');
            pGroup.innerHTML = ''; lGroup.innerHTML = ''; ptGroup.innerHTML = '';
            if (!linePoints.length) return;

            let dPath = 'M ' + linePoints[0].x + ',' + linePoints[0].y;
            for (let i = 1; i < linePoints.length; i++) dPath += ' L ' + linePoints[i].x + ',' + linePoints[i].y;
            
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', dPath); path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#22c55e');
            path.setAttribute('stroke-width', '8'); path.setAttribute('stroke-linecap', 'round'); path.setAttribute('stroke-linejoin', 'round'); path.setAttribute('filter', 'url(#glow)');
            pGroup.appendChild(path);

            if (linePoints.length > 1) {
                const totalLength = path.getTotalLength ? path.getTotalLength() : 1000;
                path.setAttribute('stroke-dasharray', totalLength);
                path.setAttribute('stroke-dashoffset', totalLength * (1 - animProgress));
            }

            linePoints.forEach((pt, i) => {
                const isReached = animProgress >= (i / Math.max(1, linePoints.length - 1)) || animProgress >= 0.99;
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pt.x); circle.setAttribute('cy', pt.y); circle.setAttribute('r', '9');
                circle.setAttribute('fill', '#22c55e');
                circle.setAttribute('stroke', '#ffffff'); circle.setAttribute('stroke-width', '3');
                circle.setAttribute('opacity', isReached ? '1' : '0.2');
                ptGroup.appendChild(circle);

                if (pt.text && pt.text.trim() && isReached) {
                    const textWidth = Math.max(100, pt.text.trim().length * 13 + 32);
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', pt.x - textWidth/2); rect.setAttribute('y', pt.y + 14);
                    rect.setAttribute('width', textWidth); rect.setAttribute('height', '40');
                    rect.setAttribute('rx', '12'); rect.setAttribute('fill', '#09090b');
                    rect.setAttribute('stroke', '#22c55e'); rect.setAttribute('stroke-width', '2');
                    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    txt.setAttribute('x', pt.x); txt.setAttribute('y', pt.y + 40);
                    txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('fill', '#ffffff');
                    txt.setAttribute('font-size', '18'); txt.setAttribute('font-weight', '700');
                    txt.textContent = pt.text.trim();
                    ptGroup.appendChild(rect); ptGroup.appendChild(txt);
                }
            });

            if (showFinalText && finalTextStr && linePoints.length > 0) {
                const lastPt = linePoints[linePoints.length - 1];
                const textWidth = Math.max(180, finalTextStr.trim().length * 20 + 40);
                const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                bgRect.setAttribute('x', lastPt.x - textWidth/2); bgRect.setAttribute('y', lastPt.y + 55);
                bgRect.setAttribute('width', textWidth); bgRect.setAttribute('height', '68');
                bgRect.setAttribute('rx', '18'); bgRect.setAttribute('fill', '#09090b');
                bgRect.setAttribute('stroke', '#f43f5e'); bgRect.setAttribute('stroke-width', '3');
                bgRect.setAttribute('filter', 'url(#glow)');
                const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                txt.setAttribute('x', lastPt.x); txt.setAttribute('y', lastPt.y + 101);
                txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('fill', '#fbbf24');
                txt.setAttribute('font-size', '34'); txt.setAttribute('font-weight', '900');
                txt.textContent = finalTextStr.trim();
                lGroup.appendChild(bgRect); lGroup.appendChild(txt);
            }
        }
        window.onload = playAnim;
    </script>
</body>
</html>
